name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping bot dashboard (keeps Render free instance awake)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://ff-glory-bot-kzti.onrender.com/api/ping || true)
            echo "ping $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
